<article class="example-card">
  <p class="label">NgModule-declared component</p>
  <h2>Receives dependencies from its module</h2>
  <p>Consumers import the exporting NgModule instead of this component directly.</p>
  <!-- Template syntax and runtime behavior are identical in both component styles. -->
  <button type="button" (click)="increment()">Clicked {{ count }} times</button>
</article>
